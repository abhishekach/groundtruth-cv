[project]
name = "groundtruth-cv"
version = "0.1.0"
description = "Honest job matching and fact-checked CV tailoring. It never invents experience."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abhishek Rajput" }]
requires-python = ">=3.11"
keywords = ["cv", "resume", "job-search", "llm", "fact-checking", "ats", "cover-letter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business",
]
dependencies = [
    "litellm>=1.50",
    "httpx>=0.27",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "reportlab>=4.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
groundtruth = "groundtruth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
